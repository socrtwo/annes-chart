<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anne's Chart</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #1f2937; color: #fff; }
      header label { display: flex; gap: 4px; align-items: center; font-size: 13px; }
      #stage { flex: 1; overflow: auto; background: #f9fafb; padding: 12px; }
      #msg { font-size: 12px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <header>
      <strong>Anne's Chart</strong>
      <label>Open <input id="file" type="file" accept=".ged,.gedcom,.csv,.json" /></label>
      <label>Chart
        <select id="kind">
          <option value="descendants">Descendants</option>
          <option value="ancestors">Ancestors (pedigree)</option>
          <option value="hourglass">Hourglass</option>
        </select>
      </label>
      <label>Person <select id="person"></select></label>
      <label>Generations <input id="gens" type="number" min="1" max="20" value="5" style="width: 3em" /></label>
      <button id="save">Save SVG</button>
      <span id="editor-tools" style="display: contents">
        <button id="new">New drawing</button>
        <select id="stencil" disabled title="Stencil">
          <option value="rounded">Rounded box</option>
          <option value="rectangle">Rectangle</option>
          <option value="ellipse">Ellipse</option>
          <option value="diamond">Diamond</option>
        </select>
        <button id="add" disabled>Add shape</button>
        <button id="connect" disabled title="Select two shapes (shift-click), then connect">Connect</button>
        <button id="delete" disabled>Delete</button>
        <button id="undo" disabled>Undo</button>
        <button id="redo" disabled>Redo</button>
        <button id="savedoc" disabled>Save .json</button>
      </span>
      <span id="msg">Open a GEDCOM (.ged) file or an org chart CSV (ID, Name, Title, Manager).</span>
    </header>
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
